<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kampung Raya Rush</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Only visible when the address ends with ?debug=true -->
  <div id="debugBanner" hidden>🛠 DEBUG MODE — testing tools are ON</div>

  <!-- The game draws every screen inside this box -->
  <main id="app" tabindex="-1">
    <div class="screen boot">
      <div class="spinner"></div>
      <p class="center">Loading the hunt…</p>
    </div>
  </main>

  <noscript>
    <div class="screen">
      <h1 class="big sm">JavaScript is off</h1>
      <p>This hunt needs JavaScript. Please switch it on in your browser settings and reload the page.</p>
    </div>
  </noscript>

  <!-- Debug panel (only filled in debug mode) -->
  <div id="debugHost"></div>

  <!-- Floating help button -->
  <button id="stuckBtn" class="stuck-btn" type="button" hidden>STUCK?</button>

  <!-- Help popup + little message bubble -->
  <div id="stuckModal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- 1) all editable text   2) the game engine -->
  <script src="js/game-config.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
